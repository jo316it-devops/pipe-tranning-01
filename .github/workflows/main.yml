name: CI-CD
on:
    push:
        branches:
            - main
    workflow_dispatch:
jobs:
    CI:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v7
            - name: Docker Hub Authentication

              uses: docker/login-action@v4
              with:
                  username: ${{ secrets.DOCKER_USERNAME }}
                  password: ${{ secrets.DOCKER_PASSWORD }}
            
            - name: Build Image Docker
              uses: docker/build-push-action@v7.3.0
              with:
                context: ./src
                file: ./src/Dockerfile
                push: true
                tags: |
                    ${{ secrets.DOCKER_USERNAME}}/teste-pipeline:v${{ github.run_number }}
                    ${{ secrets.DOCKER_USERNAME}}/teste-pipeline:latest
    CD:
        runs-on: ubuntu-latest
        needs: CI
        steps:
            - name: checkout code
              uses: actions/checkout@v7
              
            - name: Set Up Kubeconfig
              uses: azure/setup-kubectl@v3
              
            - name: Config of Kube with base 64
              run: |
                mkdir -p $HOME/.kube
                echo "${{ secrets.K8S-CONFIG }}" | base64 --decode > $HOME/.kube/config
                chmod 600 $HOME/.kube/config

            - name: Test commands
              run: |
                kubectl get nodes
                kubectl get pods
                kubectl get services


            
