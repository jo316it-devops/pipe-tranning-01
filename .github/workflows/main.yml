name: CI-CD
on:
    push:
        branches:
            - main
    workflow_dispatch:
jobs:
    CI:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@4.1.5
            - name: Docker Hub Authentication

              uses: docker/login-action@v3.1.0
              with:
                  username: ${{ secrets.DOCKER_USERNAME }}
                  password: ${{ secrets.DOCKER_PASSWORD }}